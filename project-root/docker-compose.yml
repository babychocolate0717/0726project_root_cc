services:
  db:
    image: postgres:13
    restart: always
    # 🏫 使用學術友善的 DNS
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: energy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  ingestion:
    build:
      context: ./ingestion-api
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ingestion-api:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
      - cleaner
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_SECRET_KEY=NTCUST-ENERGY-MONITOR
      - COMPATIBILITY_MODE=true
      - DEFAULT_ALLOWED_IPS=""

  cleaner:
    build:
      context: ./cleaning-api
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 168.95.1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    volumes:
      - ./cleaning-api:/code
    ports:
      - "8100:8100"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  pgdata: